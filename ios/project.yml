name: ReiPod
options:
  bundleIdPrefix: com.reipod
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  ReiPod:
    type: application
    platform: iOS
    sources:
      - path: ReiPod
        excludes: [Web, Info.plist]
      - path: ReiPod/Web
        type: folder
    info:
      path: ReiPod/Info.plist
      properties:
        CFBundleDisplayName: ReiPod
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CADisableMinimumFrameDurationOnPhone: true
        NSAppleMusicUsageDescription: ReiPod 需要读取你的音乐资料库、歌单和系统可访问的已下载播客，并通过系统播放器播放所选内容。
        NSPhotoLibraryUsageDescription: ReiPod 需要读取你允许访问的系统相册和照片，供转轮浏览与幻灯片播放，不会上传或修改照片。
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSCameraUsageDescription: 仅在你选择拍照导入照片时使用相机。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        # Apple's Xcode 16.4 / iOS 18.5 simulator WebKit overlay workaround.
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "18.4"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.reipod.player
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets: [ReiPodTests]
  ReiPodTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReiPodTests]
    dependencies:
      - target: ReiPod
    settings:
      base:
        "IPHONEOS_DEPLOYMENT_TARGET[sdk=iphonesimulator*]": "18.4"
        GENERATE_INFOPLIST_FILE: YES
